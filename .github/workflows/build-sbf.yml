name: Build SBF

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-sbf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: .

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Solana platform tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/solana
          key: ${{ runner.os }}-solana-platform-tools-v1.57

      - name: Download and install platform tools v1.57
        run: |
          mkdir -p ~/.cache/solana/v1.57/platform-tools
          cd ~/.cache/solana/v1.57/platform-tools
          # Download platform tools directly from GitHub releases
          wget -q "https://github.com/solana-labs/platform-tools/releases/download/v1.57/platform-tools-linux-x86_64.tar.bz2" -O platform-tools.tar.bz2
          tar -xjf platform-tools.tar.bz2
          rm platform-tools.tar.bz2
          echo "$HOME/.cache/solana/v1.57/platform-tools/rust/bin" >> $GITHUB_PATH

      - name: Install Solana CLI (for cargo-build-sbf)
        run: |
          # Install minimal Solana CLI to get cargo-build-sbf
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)" || true
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Build SBF
        run: |
          cargo build-sbf --arch v3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spl-token-auto-purchase-so
          path: target/deploy/spl_token_auto_purchase.so
          retention-days: 7
name: Build SBF

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-sbf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust toolchain (1.80+ for BPF)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: bpfel-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build SBF
        run: |
          cargo build --target bpfel-unknown-unknown --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spl-token-auto-purchase-so
          path: target/bpfel-unknown-unknown/release/spl_token_auto_purchase.so
          retention-days: 7
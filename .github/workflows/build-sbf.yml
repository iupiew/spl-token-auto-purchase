name: Build SBF

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-sbf:
    runs-on: ubuntu-latest
    container:
      image: anzaxyz/agave:v1.18.26
    steps:
      - uses: actions/checkout@v4
        with:
          path: .

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build SBF
        run: |
          cargo build-sbf --arch v3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spl-token-auto-purchase-so
          path: target/deploy/spl_token_auto_purchase.so
          retention-days: 7
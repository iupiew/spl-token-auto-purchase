name: Build SBF

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-sbf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: .

      - name: Install Rust 1.80+ (for lock file v4 support)
        uses: dtolnay/rust-toolchain@1.82
        with:
          target: bpfel-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana CLI (Agave v1.18.26)
        run: |
          sudo apt-get update && sudo apt-get install -y curl
          for i in {1..3}; do
            if sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"; then
              break
            fi
            echo "Retry $i/3..."
            sleep 15
          done
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Download platform tools v1.57
        run: |
          mkdir -p ~/.cache/solana/v1.57/platform-tools
          cd ~/.cache/solana/v1.57/platform-tools
          wget -q "https://github.com/solana-labs/platform-tools/releases/download/v1.57/platform-tools-linux-x86_64.tar.bz2" -O platform-tools.tar.bz2
          tar -xjf platform-tools.tar.bz2
          rm platform-tools.tar.bz2

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build SBF
        env:
          RUSTC: /home/runner/.cache/solana/v1.57/platform-tools/rust/bin/rustc
          CARGO: ${{ runner.home }}/.cargo/bin/cargo
          PATH: /home/runner/.cache/solana/v1.57/platform-tools/rust/bin:${{ env.PATH }}
        run: |
          cargo build --target bpfel-unknown-unknown --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spl-token-auto-purchase-so
          path: target/bpfel-unknown-unknown/release/spl_token_auto_purchase.so
          retention-days: 7
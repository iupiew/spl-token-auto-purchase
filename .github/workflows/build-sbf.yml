name: Build SBF

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-sbf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: .

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: bpfel-unknown-unknown

      - name: Cache Solana platform tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/solana
          key: ${{ runner.os }}-solana-platform-tools-v1.57

      - name: Install Solana CLI (Agave v1.18.26)
        run: |
          for i in {1..3}; do
            if sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"; then
              break
            fi
            echo "Retry $i/3..."
            sleep 10
          done
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Build SBF
        run: |
          cargo build-sbf --arch v3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spl-token-auto-purchase-so
          path: target/deploy/spl_token_auto_purchase.so
          retention-days: 7
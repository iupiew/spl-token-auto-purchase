name: Build SBF

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-sbf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: .

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Solana CLI (Agave v1.18.26)
        run: |
          sudo apt-get update && sudo apt-get install -y curl
          # Retry install to handle transient network issues
          for i in {1..3}; do
            if sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"; then
              break
            fi
            echo "Retry $i/3..."
            sleep 15
          done
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build SBF
        run: |
          rm -f Cargo.lock
          cargo build-sbf --arch sbfv2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spl-token-auto-purchase-so
          path: target/deploy/spl_token_auto_purchase.so
          retention-days: 7